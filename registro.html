<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="style/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
</head>
<body>
    <div class="register-container">
        <h2>Crear una Cuenta</h2>
        <form id="register-form">
            <div class="input-group">
                <label for="register-usuario">Usuario</label>
                <input type="text" id="register-usuario" required placeholder="Ingrese su usuario">
                <small class="error-message"></small>
            </div>
            
            <div class="input-group">
                <label for="register-password">Contraseña</label>
                <div class="password-wrapper">
                    <input type="password" id="register-password" required placeholder="Ingrese su contraseña">
                    <i class="bi bi-eye toggle-password" onclick="togglePassword('register-password')"></i>
                </div>
                <small class="error-message"></small>
            </div>
            
            <div class="input-group">
                <label for="register-confirm-password">Confirmar Contraseña</label>
                <div class="password-wrapper">
                    <input type="password" id="register-confirm-password" required placeholder="Confirme su contraseña">
                    <i class="bi bi-eye toggle-password" onclick="togglePassword('register-confirm-password')"></i>
                </div>
                <small class="error-message"></small>
            </div>
            
            <button type="submit">Registrar</button>
        </form>
        <p>¿Ya tienes una cuenta? <a href="index.html">Inicia sesión</a></p>
    </div>
    <script src="js/registro.js"></script>
</body>
</html>
