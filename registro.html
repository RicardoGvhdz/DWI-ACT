<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <!-- Cerrar correctamente el enlace de tu archivo CSS -->
    <link rel="stylesheet" href="style/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="register-container">
        <h2>Crear una Cuenta</h2>
        <form id="register-form">
            <div class="input-group">
                <label for="register-usuario">Usuario</label>
                <input type="text" id="register-usuario" required placeholder="Ingrese su usuario">
            </div>
            
            <div class="input-group">
                <label for="register-password">Contraseña</label>
                <input type="password" id="register-password" required placeholder="Ingrese su contraseña">
            </div>
            
            <div class="input-group">
                <label for="register-confirm-password">Confirmar Contraseña</label>
                <input type="password" id="register-confirm-password" required placeholder="Confirme su contraseña">
            </div>
            
            <button type="submit">Registrar</button>
        </form>
        <p>¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a></p>
    </div>
    <script src="js/registro.js"></script>
</body>
</html>
